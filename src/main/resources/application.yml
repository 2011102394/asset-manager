spring:
  application:
    name: asset-manager
  profiles:
    active:
    - dev
  security:
    user:
      name: admin
      password: 123456
server:
  port: 8081
# mybatis-plus 配置
mybatis-plus:
  # 搜索指定包名
  type-aliases-package: com.arsc.asset.**.domain
  # 配置mapper的扫描
  mapper-locations: classpath*:mapper/**/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 数据库配置
      id-type: auto
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.arsc.asset.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
